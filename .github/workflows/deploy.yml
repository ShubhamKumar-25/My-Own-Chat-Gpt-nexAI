name: Full-Stack CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-ci:
    name: Frontend CI (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        run: |
          if [ -d "frontend" ]; then cd frontend && npm install; else npm install; fi

      - name: Run Production Build Test
        run: |
          if [ -d "frontend" ]; then cd frontend && npm run build; else npm run build; fi

  backend-ci:
    name: Backend CI (Node.js API)
    runs-on: ubuntu-latest
    needs: frontend-ci

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Backend Dependencies
        run: |
          if [ -d "backend" ]; then cd backend && npm install; else npm install; fi
