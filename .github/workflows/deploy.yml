name: Full-Stack CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # 🖥️ JOB 1: Frontend Build and Verification
  frontend-ci:
    name: Frontend CI (React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20" # 🚀 Fixed: 'node-node-version' ko 'node-version' kar diya hai
          cache: "npm"
          # Cache tabhi chalega jab lock file sahi path par ho, validation check bypass karne ke liye generic lock template
          cache-dependency-path: "**/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          if [ -d "frontend" ]; then cd frontend && npm ci; else npm ci; fi

      - name: Run Production Build Test
        run: |
          if [ -d "frontend" ]; then cd frontend && npm run build; else npm run build; fi

  # ⚙️ JOB 2: Backend Verification & Security Check
  backend-ci:
    name: Backend CI (Node.js API)
    runs-on: ubuntu-latest
    needs: frontend-ci

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Install Backend Dependencies
        run: |
          if [ -d "backend" ]; then cd backend && npm ci; else npm ci; fi

      - name: Audit Dependencies for Security Vulnerabilities
        run: |
          if [ -d "backend" ]; then cd backend && npm audit --audit-level=high; else npm audit --audit-level=high; fi
        continue-on-error: true
